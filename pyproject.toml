[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "musicbot-downloader"
version = "0.1.0"
description = "Provider-independent foundation for a Telegram music downloader service"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "Proprietary" }
dependencies = [
  "aiogram>=3.30,<4",
  "aiosqlite>=0.20,<1",
  "alembic>=1.14,<2",
  "fastapi>=0.116,<1",
  "pydantic>=2.10,<3",
  "pydantic-settings>=2.7,<3",
  "sqlalchemy[asyncio]>=2.0.36,<3",
  "uvicorn>=0.35,<1",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.14,<2",
  "httpx>=0.28,<1",
  "pytest>=8.3,<9",
  "pytest-asyncio>=1.0,<2",
  "ruff>=0.9,<1",
]
# OnTheSpot does not publish a stable library API. Keep its large GUI/media
# dependency tree optional and pin the inspected v1.8.1 commit exactly.
onthespot = [
  "onthespot @ git+https://github.com/ots-downloader/onthespot.git@8ed6cf33ef772e6569d5014237e0fb4ce8b9e45d",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
  "external: requires external network access and provider authentication",
]

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = [".uv-cache"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
exclude = ["alembic/versions"]
